apiVersion: v1
kind: Pod
metadata:
  labels:
  name: nginx-storage
spec:
  containers:
    - image: nginx
      name: nginx
      volumeMounts:
        - mountPath: /app/data
          name: task-pv-storage 
    - image: busybox
      name: busybox
      command: ["/bin/sh","-c"]
      args: ["sleep 1000"]
      volumeMounts:
        - mountPath: /app/data
          name: task-pv-storage
  volumes:
    - name: task-pv-storage
      persistentVolumeClaim: 
        claimName: task-pv-claim
