[project]
name = "json-crud"
version = "0.1.0"
description = "This is a JSON Crud example withouit a database"
readme = "README.md"
authors = [
    { name = "Chris Kronberg", email = "ckronber@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.3",
]

[project.scripts]
json-crud = "json_crud:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
